[project]
name = "bookstats"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "marimo>=0.24.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "scipy>=1.18.1",
]
readme = "README.md"
description = "A cumulative research project analyzing Project Gutenberg word distributions"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort import sorting
    "D",    # pydocstyle docstring conventions
    "UP",   # pyupgrade modern Python syntax
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
